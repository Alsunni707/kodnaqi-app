<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تصحيح قاعدة البيانات (معايير عالمية)</title>
<style>
body{font-family:system-ui;padding:16px;background:#0d3b66;color:#fff;margin:0;}
.box{max-width:700px;margin:20px auto;background:#fff;color:#0d3b66;padding:20px;border-radius:14px;}
h1{margin:0 0 12px;font-size:1.2rem;}
button{width:100%;padding:15px;font-size:1rem;font-weight:700;border:none;border-radius:10px;cursor:pointer;background:#dc3545;color:#fff;}
button:disabled{background:#94a3b8;cursor:not-allowed;}
#log{margin-top:16px;font-family:monospace;font-size:0.75rem;background:#0f172a;color:#a5f3fc;padding:12px;border-radius:8px;max-height:400px;overflow-y:auto;white-space:pre-wrap;display:none;}
</style>
</head>
<body>
<div class="box">
  <h1>🔬 تصحيح الحقول (قوائم منسدلة)</h1>
  <p style="font-size:0.9rem;">سيقوم هذا الإصلاح بتحويل الحقول النصية إلى قوائم منسدلة للفحوصات التي تتطلب ذلك (الملاريا، الويدال، البول، إلخ) لتعمل بالمعايير العالمية.</p>
  <button id="btn" onclick="run()">🚀 بدء التصحيح</button>
  <div id="log"></div>
</div>
<script src="db.js"></script>
<script>
async function run() {
  const btn = document.getElementById('btn');
  const log = document.getElementById('log');
  btn.disabled = true; btn.textContent = '⏳ جاري الإصلاح...';
  log.style.display = 'block'; log.textContent = '';
  function print(x){ log.textContent += x+'\n'; log.scrollTop = log.scrollHeight; }

  try {
    const tests = await dbGetAll('tests');
    const params = await dbGetAll('parameters');
    let updated = 0;

    const rules = [
      // الملاريا المجهرية (BFFM)
      { testMatch: /malaria.*(microscop|film|thick|bffm)/i, 
        paramMatch: /result|finding/i, opts: 'No Malaria Parasite Seen|Malaria Parasite Seen' },
      { testMatch: /malaria.*(microscop|film|thick|bffm)/i, 
        paramMatch: /species/i, opts: 'Not Applicable|P. falciparum|P. vivax|P. malariae|P. ovale|Mixed' },
      { testMatch: /malaria.*(microscop|film|thick|bffm)/i, 
        paramMatch: /stage/i, opts: 'Not Applicable|Ring|Trophozoite|Schizont|Gametocyte|Multiple' },
      { testMatch: /malaria.*(microscop|film|thick|bffm)/i, 
        paramMatch: /density/i, opts: 'Not Applicable|Scanty|+|++|+++|++++' },
      
      // الملاريا السريعة (ICT/RDT)
      { testMatch: /malaria.*(ict|rdt|rapid|poct)/i, 
        paramMatch: /result/i, opts: 'Negative|Positive Reactive P. falciparum|Positive Reactive P. vivax|Positive Reactive P. ovale|Positive Reactive P. malariae|Positive Reactive Mixed' },
      { testMatch: /malaria.*(ict|rdt|rapid|poct)/i, 
        paramMatch: /species/i, opts: 'Not Applicable|P. falciparum|P. vivax|P. ovale|P. malariae|Mixed' },

      // الويدال والتيفويد
      { testMatch: /widal/i, paramMatch: /.*/, opts: 'Negative|1:20|1:40|1:80|1:160|1:320|1:640' },
      { testMatch: /typhoid.*(ict|rapid)/i, paramMatch: /result/i, opts: 'Negative|Positive' },

      // فصائل الدم وعامل RH
      { testMatch: /blood group|abo/i, paramMatch: /.*/, opts: 'A|B|AB|O' },
      { testMatch: /rh\s*factor/i, paramMatch: /.*/, opts: 'Positive|Negative' },

      // المصلية (HIV, HBsAg, HCV)
      { testMatch: /hiv|hbsag|hcv|hepatitis|vdrl|rpr|syphilis/i, paramMatch: /.*/, opts: 'Non-Reactive|Reactive' },

      // البول
      { testMatch: /urine|urinalysis/i, paramMatch: /protein|glucose|ketone|blood|nitrite/i, opts: 'Negative|Trace|1+|2+|3+|4+' },
      { testMatch: /urine|urinalysis/i, paramMatch: /color/i, opts: 'Pale Yellow|Yellow|Dark Yellow|Amber|Red|Brown' }
    ];

    for (const test of tests) {
      let testChanged = false;
      const testParams = params.filter(p => p.test_id === test.id);

      for (const p of testParams) {
        // تخطي إذا كان رقماً بالفعل
        if (p.result_type === 'numeric') continue;

        let matchedRule = null;
        for (const rule of rules) {
          if (rule.testMatch.test(test.name) && rule.paramMatch.test(p.name)) {
            matchedRule = rule;
            break;
          }
        }

        if (matchedRule) {
          await dbPut('parameters', {
            ...p,
            result_type: 'select',
            options: matchedRule.opts,
            ref_text: matchedRule.opts.split('|')[0] // القيمة الافتراضية
          });
          updated++;
          testChanged = true;
        }
      }
      if (testChanged) print(`✅ تم تصحيح: ${test.name}`);
    }

    print(`\n✅ اكتمل الإصلاح. تم تحديث ${updated} معيار.`);
    btn.textContent = '✅ اكتمل — أعد تحميل التطبيق (F5)';
  } catch(e) {
    print('❌ ' + e.message);
    btn.disabled = false;
  }
}
</script>
</body>
</html>
