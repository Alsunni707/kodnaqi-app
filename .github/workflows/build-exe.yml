name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci
      shell: pwsh

    - name: Debug: environment and npm info
      run: |
        Write-Host "=== Node / npm ==="
        node -v
        npm -v
        Write-Host "=== npm config ==="
        npm config list
        Write-Host "=== Workspace (top-level) ==="
        Get-ChildItem -Force -Recurse -Depth 1 | Select-Object -First 200
      shell: pwsh

    - name: Build web assets
      run: npm run build
      shell: pwsh

    - name: Ensure NSIS (needed by some packagers)
      run: choco install nsis -y
      shell: pwsh

    - name: Build EXE
      run: npm run build-win
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: KodNaqi-Setup-EXE
        path: dist/*.exe
        if-no-files-found: error
        retention-days: 14
