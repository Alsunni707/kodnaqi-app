<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إصلاح جراحي للفحوصات الطبية</title>
<style>
body{font-family:system-ui;padding:16px;background:#0d3b66;color:#fff;margin:0;}
.box{max-width:600px;margin:20px auto;background:#fff;color:#0d3b66;padding:20px;border-radius:14px;}
h1{margin:0 0 12px;font-size:1.2rem;}
button{width:100%;padding:15px;font-size:1rem;font-weight:700;border:none;border-radius:10px;cursor:pointer;background:#dc3545;color:#fff;}
button:disabled{background:#94a3b8;cursor:not-allowed;}
#log{margin-top:16px;font-family:monospace;font-size:0.75rem;background:#0f172a;color:#a5f3fc;padding:12px;border-radius:8px;max-height:400px;overflow-y:auto;white-space:pre-wrap;display:none;}
</style>
</head>
<body>
<div class="box">
  <h1>🔧 إصلاح الملاريا والويدال</h1>
  <p style="font-size:0.9rem;">سيتم تحديث الفحوصات التالية لتظهر كقوائم منسدلة دقيقة:</p>
  <ul style="font-size:0.85rem;">
    <li>Malaria ICT (يظهر Negative / Positive Reactive...)</li>
    <li>Malaria Microscopy (يظهر No Malaria Parasite / Malaria Parasite)</li>
    <li>Widal (يظهر Negative / 1:20 / 1:40 ...)</li>
    <li>Typhoid ICT (يظهر Negative / Positive)</li>
  </ul>
  <button id="btn" onclick="run()">🚀 بدء الإصلاح</button>
  <div id="log"></div>
</div>
<script src="db.js"></script>
<script>
async function run() {
  const btn = document.getElementById('btn');
  const log = document.getElementById('log');
  btn.disabled = true; btn.textContent = '⏳ جاري الإصلاح...';
  log.style.display = 'block'; log.textContent = '';
  function print(x){ log.textContent += x+'\n'; log.scrollTop = log.scrollHeight; }

  try {
    const tests = await dbGetAll('tests');
    const params = await dbGetAll('parameters');
    let updated = 0;

    const rules = [
      { match: /malaria.*ict|ict.*malaria/i, 
        opts: 'Negative|Positive Reactive P. falciparum|Positive Reactive P. vivax|Positive Reactive P. ovale|Positive Reactive P. malariae|Positive Reactive Mixed', 
        defaultTxt: 'Negative' },
      { match: /malaria.*(microscop|film|thick)/i, 
        opts: 'No Malaria Parasite Seen|Malaria Parasite Seen', 
        defaultTxt: 'No Malaria Parasite Seen' },
      { match: /widal/i, 
        opts: 'Negative|1:20|1:40|1:80|1:160|1:320|1:640', 
        defaultTxt: 'Negative' },
      { match: /typhoid.*ict|ict.*typhoid/i, 
        opts: 'Negative|Positive', 
        defaultTxt: 'Negative' }
    ];

    for (const test of tests) {
      for (const rule of rules) {
        if (rule.match.test(test.name)) {
          const testParams = params.filter(p => p.test_id === test.id);
          print(`\n📋 ${test.name}`);
          
          for (const p of testParams) {
            // تخطي الحقول الرقمية (مثل الكثافة)
            if (p.result_type === 'numeric') continue;

            print(`   تحديث: ${p.name} -> قائمة منسدلة`);
            await dbPut('parameters', {
              ...p,
              result_type: 'select',
              options: rule.opts,
              ref_text: rule.defaultTxt
            });
            updated++;
          }
        }
      }
    }
    print(`\n✅ اكتمل. تم تحديث ${updated} معيار.`);
    btn.textContent = '✅ اكتمل — أعد تحميل التطبيق';
  } catch(e) {
    print('❌ ' + e.message);
    btn.disabled = false;
  }
}
</script>
</body>
</html>
